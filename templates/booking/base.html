<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BusBook{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f4f7fb; color: #15243a; }
    .navbar { background: #112b49; }
    .hero { background: linear-gradient(120deg,#123b60,#1f6d90); color: white; border-radius: 1.5rem; }
    .card { border: 0; border-radius: 1rem; box-shadow: 0 6px 24px #16324d12; }
    .seat { min-width: 3.5rem; margin: .3rem; }
    .seat-check:checked + label { background: #116f58; border-color: #116f58; color: white; }
    .badge-soft { background: #e7f5f0; color: #0a6650; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">BusBook</a>
    <div class="d-flex gap-3 align-items-center">
      <a class="text-white text-decoration-none" href="{% url 'home' %}">Find buses</a>
      {% if user.is_authenticated %}
        <a class="text-white text-decoration-none" href="{% url 'my_bookings' %}">My bookings</a>
        {% if user.is_staff %}<a class="text-white text-decoration-none" href="/admin/">Admin</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button></form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
